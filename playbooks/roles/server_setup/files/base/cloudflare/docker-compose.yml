services:
  cloudflare_tunnels:
    image: cloudflare/cloudflared:2026.8.3
    container_name: cloudflare_tunnels
    restart: unless-stopped
    network_mode: host
    environment:
      - CLOUDFLARE_TOKEN
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 100M