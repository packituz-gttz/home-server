---
- name: Create Suwayomi media directories
  ansible.builtin.file:
    path: /mnt/media-nvm/Suwayomi/data
    state: directory
    mode: '0755'
    owner: '{{ superuser_name }}'
    group: '{{ superuser_name }}'

- name: Create suwayomi.env file
  ansible.builtin.copy:
    dest: /mnt/media-nvm/Suwayomi/suwayomi.env
    content: |
      TZ=Etc/UTC
      FLARESOLVERR_ENABLED=true
      FLARESOLVERR_URL=http://flaresolverr:8191
      EXTENSION_STORES=["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]
      DOWNLOAD_AS_CBZ=true
      AUTH_MODE=basic_auth
      AUTH_USERNAME={{ suwayomi_auth_username }}
      AUTH_PASSWORD={{ suwayomi_auth_password }}

- name: Copy Docker-compose file
  ansible.posix.synchronize:
    src: files/downloaders/suwayomi/docker-compose.yml
    dest: /mnt/media-nvm/Suwayomi

- name: Run Suwayomi
  community.docker.docker_compose_v2:
    project_src: /mnt/media-nvm/Suwayomi
    recreate: always

...