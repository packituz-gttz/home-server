---
- name: Create OliveTin directories
  ansible.builtin.file:
    path: /mnt/media-nvm/OliveTin/config/
    state: directory
    owner: '{{ superuser_name }}'
    group: '{{ superuser_name }}'
    mode: '0755'

- name: Copy config
  become: true
  ansible.builtin.copy:
    src: files/base/olivetin/config.yaml
    dest: /mnt/media-nvm/OliveTin/
    mode: preserve

- name: Create .env file
  ansible.builtin.copy:
    dest: /mnt/media-nvm/OliveTin/.env
    content: |
      ADMIN_PASSWORD='{{ olivetin_admin_password }}'
      ADMIN_USER='{{ olivetin_admin_user }}'
      OLIVETIN_K3S_TOKEN='{{ olivetin_k3s_token }}'

- name: Copy Docker-compose file
  ansible.posix.synchronize:
    src: files/base/olivetin/docker-compose.yml
    dest: /mnt/media-nvm/OliveTin

- name: Run OliveTin
  community.docker.docker_compose_v2:
    project_src: /mnt/media-nvm/OliveTin
    recreate: always
...